name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest PyYAML
      - run: python -m compileall -q pipeline.py scripts tests
      - run: pytest -q
      - run: bash -n scripts/*.sh
      - name: Reject private runtime material
        run: |
          ! git grep -En '(hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)'
